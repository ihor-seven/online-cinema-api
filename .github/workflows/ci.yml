name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_password
      POSTGRES_DB: cinema_db
      SECRET_KEY: ci-only-secret-key

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Check formatting (black)
        run: poetry run black --check .

      - name: Lint (flake8)
        run: poetry run flake8 src tests

      - name: Type check (mypy)
        run: poetry run mypy src

      - name: Run tests with coverage
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            cd ~/online-cinema-api
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up --build -d
            docker compose -f docker-compose.prod.yml exec -T web alembic upgrade head
            curl -fsS --retry 10 --retry-delay 3 --retry-connrefused http://localhost/health
            docker image prune -f
          EOF
